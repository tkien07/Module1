    <h1>Nhập điểm các môn</h1>
    <script>
        let diemVatly = parseFloat(prompt("Nhập điểm vật lý"));
        let diemHoahoc = parseFloat(prompt("Nhập điểm hóa học"));
        let diemSinhhoc = parseFloat(prompt("Nhập điểm sinh học"));

        let tongDiem = diemVatly + diemHoahoc + diemSinhhoc
        let diemTB = tongDiem/3
        document.write("<p>Tổng điểm ba môn là: " + tongDiem + "</p> ")
        alert('Tổng điểm ba môn là: ' + tongDiem)

        document.write("<p>Điểm trung bình ba môn là: " + diemTB + "</p> ")
        alert('Điểm trung bình ba môn là: ' + diemTB)
    </script>
