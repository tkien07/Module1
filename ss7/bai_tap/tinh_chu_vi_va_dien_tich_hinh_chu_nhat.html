<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

     <script >
        inputWith = prompt("Nhập chiều rộng")
        inputHeigh = prompt("Nhập chiều cao")

        // <--parseInt chuyển kiểu chuổi sang số nguyên-->
        let width = parseInt(inputWith);    
        let heigh = parseInt(inputHeigh);

        let dt = width * heigh 
        let cv = (width + heigh) * 2
        document.write("<p>Diện tích hình chữ nhật là:"   + dt+ "<p/> ") 
        alert("Diện tích hình chữ nhật là: "  + dt) 

        document.write("<p>Chu vi hình chữ nhật là:"  + cv +"<p/> " )
        alert("Chu vi hình chữ nhật là: "  + cv) 
     </script>  


    
</body>
</html>
