<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tuoi = parseInt(prompt("Nhập số tuổi của người"));

        if (!isNaN(tuoi) && tuoi < 0 ){
            alert("Không phải tuổi 1 người")
        } else  if(tuoi < 120){
            alert("Đúng tuổi một người")
        }
    </script>
</body>
</html>
