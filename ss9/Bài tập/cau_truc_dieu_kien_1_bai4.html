    <script>
        let a = prompt("Nhập a")
        let b = prompt("Nhập b")
        let c = prompt("Nhập c")

        if((a != 0) && (b != 0) && (c != 0)){
            if(( a > 0) && ( b > 0) && ( c > 0) ){
                if((a > b) && (a > c)){
                    alert(" a Số lớn nhất")
                } else if((b > a) && (b > c)){
                    alert("b bSố lớn nhất")
                } else if((c > a) && (c > b)){
                    alert("c Số lớn nhất")
                } else{
                    alert("Nhập đúng dữ liệu")
                }
            }
        }
      </script>
