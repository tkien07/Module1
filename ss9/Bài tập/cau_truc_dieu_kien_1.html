      <script>
        let soPhut = parseFloat(prompt("Nhập số phút gọi"));
        let tien = 0;

        if (isNaN(soPhut) || soPhut < 0){
            alert("Nhập số hợp lệ")
        } else {
            if ( soPhut < 50){
                tien = soPhut * 600;
            } else if ( soPhut <=150){
                tien = 50 * 600 + (soPhut - 50);
            } else{
                tien = 50 * 600 + 100 * 400 + (soPhut - 150) * 200;
            }
            alert("Số tiền: " + tien + " VND")
        }
        
      </script>
