<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 7</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Nhập a"));
        let b = parseInt(prompt("Nhập b"));
        let c = parseInt(prompt("Nhập c"));

        if( a === 0){
            alert("Không phải PT");
        } else {
            let delta = b * b - 4 * a * c;

            if( delta > 0){
                let x1 = (-b + Math.sqrt(delta)) / 2 * a;
                let x2 = (-b - Math.sqrt(delta)) / 2 * a;
                alert("2 Ngiệm: x1 =" + x1 + ",  x2 = " + x2);
            } else if (delta ==0 ) {
                let x =-b / (2 * a);
                alert("Nghiệm kép: " + x);
            } else{
                alert("Phương trình vô nghiệm");
            }
        }
    </script>
</body>
</html>
