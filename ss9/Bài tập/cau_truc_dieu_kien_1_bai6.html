<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6</title>
</head>

<body>
    <script>
        let doanhSo = parseFloat(prompt("Nhập doanh số bán hàng"));
        let hoaHong = 0;
        if (doanhSo) {
            console.log(doanhSo)
            if (doanhSo < 50) {
                hoaHong = doanhSo * 0.03;
                alert(" Hoa hồng: " + hoaHong + "triệu");
            } else if (doanhSo <= 100) {
                hoaHong = doanhSo * 0.05;
                alert(" Hoa hồng: " + hoaHong + "triệu");
            } else {
                hoaHong = doanhSo * 0.07;
            }
            alert(" Hoa hồng: " + hoaHong + "triệu");
        }

    </script>
</body>

</html>
