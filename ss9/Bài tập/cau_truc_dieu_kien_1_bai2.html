<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2</title>
</head>
<body>
    <script>
        let hocSinh = prompt("Nhập tuổi");

        if( hocSinh === "" || hocSinh === null){
            alert("Nhập tuổi của    bạn")
        } else if( hocSinh >= 15)  {
            alert("Đủ tuổi vào lớp 10")
        } else{
            alert ("Chưa đủ tuổi")
        }
     </script>
</body>
</html>
