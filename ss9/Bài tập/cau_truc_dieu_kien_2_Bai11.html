<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11</title>
</head>

<body>
    <script>
        let thuNhap = parseInt(prompt("Nhập số tiền thu nhập"));
        let thue = 0;

        if (isNaN(thuNhap) && thuNhap < 0) {
            alert("Nhập số tiền không hợp lệ")
        } else {

            if (thuNhap <= 5) {
                 thue = thuNhap * 0.05;
            } else if (thuNhap <= 10) {
                 thue = 5 * 0.05 + (thuNhap - 5) * 0.10;
            } else if (thuNhap <= 18) {
                 thue = 5 * 0.05 + 5 * 0.10 + (thuNhap - 10) * 0.15;
            } else {
                 thue = 5 * 0.05 + 5 * 0.10 + 8 * 0.15 + (thuNhap - 18) * 0.20;
            }
            alert("Số tiền thuế: " + thue + " VND")
        }
        
    </script>
</body>

</html>
