<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9</title>
</head>
<body>
    <script>
        let a = parseInt(prompt("Nhập cạnh a"));
        let b = parseInt(prompt("Nhập cạnh b"));
        let c = parseInt(prompt("Nhập cạnh c"));

        if(!isNaN(a) && !isNaN(b) &&!isNaN(c)){
            if (a > 0 && b > 0 && c > 0 && a + b > c && b + c > a && a + c > b){
                alert( "Là một tam giác");
            } else {
                alert("Không phải là một tam giác");
            }
        }
    </script>
</body>
</html>
