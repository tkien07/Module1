<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .container{
    align-items: center;
    margin-bottom: 10px;
    }
    label {
    width: 120px; /* Cố định độ rộng để các ô input thẳng hàng */
    display: inline-block;
}

input {
    padding: 1px;
    flex: 1; /* Để input tự động chiếm phần không gian còn lại (tùy chọn) */
    max-width: 200px;
    margin-bottom: 15px;
}

button {
    margin-left: 120px; /* Đẩy nút bấm sang phải cho bằng với ô input */
    padding: 1px 20px;
    
}
</style>
<body>
    <div class="container">
        <h3>Tính chu vi và diện tích Hình Chữ Nhật</h3>
        <label>Chiều dài (a):</label>
        <input type="number" id="length" placeholder="Nhập chiều dài..."><br>

        <label>Chiều rộng (b):</label>
        <input type="number" id="width" placeholder="Nhập chiều rộng..."><br>

        <button onclick="tinhToan()">Tính toán</button>

        <div class="result" id="ketQua"></div>
    </div>
    <script>
        function tinhToan() {
        // Lấy giá trị từ các ô input
        let a = parseFloat(document.getElementById("length").value);
        let b = parseFloat(document.getElementById("width").value);
        let hienThi = document.getElementById("ketQua");

        // Kiểm tra dữ liệu đầu vào
        if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
           alert('Không hợp lệ')
            return;
        }

        // Thực hiện công thức
        let chuVi = (a + b) * 2;
        let dienTich = a * b;

        // Hiển thị kết quả
        alert("Kết quả hình chữ nhật:\n" + 
          "- Chu vi là: " + chuVi + "\n" + 
          "- Diện tích là: " + dienTich);
}
    </script>
</body>

</html>
