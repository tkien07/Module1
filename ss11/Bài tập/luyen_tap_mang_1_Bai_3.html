<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let array = [5, 6, 12, 2, 3];
        let sum = 0;
        let max;

        max = array[0];
        for (let i = 0; i < array.length; i++) {
            if (array[i] > max) {
                max = array[i];
            }
            sum += array[0];
        }
        let trungBinh = sum / array.length;
        alert("Giá trị lớn nhất: " + max);
        alert("Trung bình các phần tử: " + trungBinh);
    </script>
</body>

</html>
