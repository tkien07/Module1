    <script>
        let str = "The Quick Brown Fox";
        let result = "";

        for (let i = 0; i < str.length; i++) {
            if (str[i] === str[i].toUpperCase()) {
                result += str[i].toLowerCase();
            } else {
                result += str[i].toUpperCase();
            }
            console.log(result);
        }
    </script>
