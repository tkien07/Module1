<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let array = [];
        for (let i = 0; i < 10; i++) {
            array[i] = parseInt(prompt("Nhập số:"));
        }
        for (let i = 0; i < 9; i++) {
            for (let j = i + 1; j < 10; j++) {
                if (array[i] < array[j]) {
                    let temp = array[i];
                    array[i] = array[j];
                    array[j] = temp;
                }
            }
        }
        console.log("Mảng sau khi sắp xếp giảm dần: " + array);
    </script>
</body>

</html>
