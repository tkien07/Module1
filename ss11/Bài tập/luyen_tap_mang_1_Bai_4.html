<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <script>
        let array = [1, 2, 5, 6, 11];
        let n = array.length;
        for( i = 0; i < n / 2; i++){
            let temp = array[i];
            array[i] = array[ n - 1 -i];
            array[n - 1 - i] = temp;
        }
        console.log("Đảo ngược: " + array);
    </script>
</body>
</html>
