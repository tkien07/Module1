<!DOCTYPE html>

<body>
    <script>
        let array = [1, 2, 3, 4];
        let countSo = 0;
        let countChu = 0;

        
        for( let i = 0; i < array.length; i++ ){
            if(!isNaN(array[i])){
                countSo++;
            } else {
                countChu++;
            }
        }
        if(countSo == array.length){
            alert("OK số");
        } else if (countChu == array.length) {
            alert("QUa chữ rồi");
        } else{
            alert("Cả số cả chữ");
        }
        // if( array % 1 ==0){

    </script>
</body>
