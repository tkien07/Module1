<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let stars = ["Polaris", "Aldebaran", "Deneb", "Vega", "Altair", "Dubhe", "Regulus"];
         let constellations = ["Ursa Minor", "Taurus", "Cygnus", "Lyra", "Aquila", "Ursa Major", "Leo"];

         function findStars(name){
            let index = stars.indexOf(name);
            if( index != -1){
                return constellations[index];
            } else{
                return "Không tìm thấy";
            }
         }
         let input = prompt("Nhập ngôi sao:");
         let result = findStars(input);

         alert(result);

    </script>
</body>
</html>
