<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         let stars = ["Polaris", "Aldebaran", "Deneb", "Vega", "Altair", "Dubhe", "Regulus"];
         let constellations = ["Ursa Minor", "Taurus", "Cygnus", "Lyra", "Aquila", "Ursa Major", "Leo"];

         function findStars(name){
            for(let i = 0; i < stars.length; i++){
                if(stars[i] === name){
                    return constellations[i];
                }
            }
            return "Không tìm thấy";
         }
         let input = prompt("Nhập ngôi sao:");
         let result = findStars(input);

         alert(result);

    </script>
</body>
</html>
