<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function tangSo(number){
            number++;
            return number;
        }
        let number = parseInt(prompt("Nhập số"));
        let ketQua = tangSo(number);
        alert("Kết Quả: " + ketQua);
    </script>
</body>
</html>
