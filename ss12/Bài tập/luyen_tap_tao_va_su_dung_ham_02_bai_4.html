<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function kyTuSo(n){
            return n >= "0" && n <= "9";
        }
        let input = prompt("Nhập ký tự số");
        if(input.length == 1 && kyTuSo(input)){
            alert("Là ký tự số")
        } else {
            alert("Không phải ký tự số");
        }
    </script>
</body>
</html>
