<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function timMin(arr) {
            let min = arr[0];
            for (let i = 0; i < array.length; i++) {
                if (arr[i] < min) {
                    min = arr[i];
                }
            }
            return min;
        }
        let n = parseFloat(prompt("Nhập số nguyên bất kỳ"));
        let array = new Array(n);

        for (let i = 0; i < array.length; i++) {
            array[i] = +prompt("Nhập phần tử thứ " + i);
        }

        let result = timMin(array);
        alert("Số có giá tri nhỏ nhất: " + result);

    </script>
</body>

</html>
