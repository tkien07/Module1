<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function binhPhuong(x){
            return x * x;
        }
        let n = parseFloat(prompt("Nhập số: "));
        let result = binhPhuong(n);
        alert("Bình phương: " + result);
    </script>
</body>
</html>
