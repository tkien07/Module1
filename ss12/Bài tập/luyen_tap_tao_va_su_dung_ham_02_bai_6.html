<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function soNguyenDuong(n){
            if( n > 0 && n % 1 == 0){
                return true;
            } else {
                return false;
            }
        }
        let input = parseFloat(prompt("Nhập số nguyên dương"));
        alert(soNguyenDuong(input));
    </script>
</body>
</html>
