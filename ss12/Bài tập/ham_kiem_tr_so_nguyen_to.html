<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function isPrime(number){
            if( number < 2 )
            return false;

            for(let i = 2; i < Math.sqrt(number); i++){
                if(number % i === 0){
                    return false;
                }
            }
            return true;
        }
        let n =parseFloat(prompt("Nhập số kiểm tra: "));
        if(isPrime(n)){
            alert(n + ": là số nguyên tố");
        } else {
            alert(n + ": không phải số nguyên tố");
        }
    </script>
</body>
</html>
