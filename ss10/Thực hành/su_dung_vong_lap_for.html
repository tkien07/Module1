    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Java Loops</h1>
    <p id="demo"></p>
    <script>
        let text = "";
        let i;

        for( i = 0; i < 5; i++){
            text += "The number is " + i + "<br>";
        }
        document.getElementById("demo").innerHTML = text;
    </script>
