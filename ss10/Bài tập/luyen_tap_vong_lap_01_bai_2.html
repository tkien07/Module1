<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Bài 2 -->
    <script>
        let nhietDo = parseFloat(prompt("Nhập nhiệt độ"));
        if (nhietDo > 100) {
            alert("Hãy giảm nhiệt độ");
        } else if (nhietDo < 20) {
            alert("Nhiệt độ thấp, hãy tăng nhiệt độ");
        } else {
            alert("Nhiệt độ bình thường");
        }
     </script>
</body>
</html>
