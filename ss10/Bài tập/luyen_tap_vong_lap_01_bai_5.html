<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Bài 5 -->
    <script>
        let a = 0, b = 1;
        let sum = 0;
        for (let i = 1; i <= 20; i++) {
            sum += a;
            let next = a + b;
            a = b;
            b = next;
        }
        alert("Tổng 20 số Fibonacci đầu tiên là: " + sum);
    </script>
</body>
</html>
