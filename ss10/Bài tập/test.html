<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let flag = true;
        while (flag) {
            let chonDanhMuc = prompt(
                "Chức năng \n" +
                "1.Hiển thị\n" +
                "2.Thêm danh sách\n" +
                "3.Xóa danh sách\n" +
                "4.Thoát\n"
            );
            switch (chonDanhMuc) {
                case "1":
                    alert("Hiện thị danh sách");
                    break;
                case "2":
                    alert("Thêm danh sách");
                    break;
                case "3":
                    alert("Xóa danh sách");
                    break;
                default:
                    alert("Thoát");
                    flag = false;
            }
        }
    </script>
</body>

</html>
