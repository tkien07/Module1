<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Hình 1 -->
    <script>
        for (let i = 1; i < 6; i++) {
            let dong = " ";
            for (let j = 1; j <= i; j++) {
                dong += "*"
            }
            document.write(dong + "<br>");
        }
    </script>
    "---------------------------------- "<br><br>
     <script>
        for (let i = 5; i >= 1; i--) {
            let dong = " ";
            for (let j = 1; j <= i; j++) {
                dong += "*"
            }
            document.write(dong + "<br>");
        }
     </script>
     "---------------------------------- "<br><br>
      <script>
        for (let i = 1; i <= 5; i++) {
            let dong = " ";
            for (let j = 1; j <= 5-i ; j++) {
                dong += "&nbsp;&nbsp;"
            }
            for (let j = 1; j <= i ; j++) {
                dong += "*"
            }
            document.write(dong + "<br>");
        }
      </script>
      "---------------------------------- "<br><br>
      <script>
        for (let i = 1; i < 6; i++) {
            let dong = " ";
            for (let j = 1; j < 6; j++) {
                if(j < i){
                    dong += "&nbsp;&nbsp;"
                } else {
                    dong += "*"
                }
            }
            document.write(dong + "<br>");
        }
      </script>
</body>

</html>
