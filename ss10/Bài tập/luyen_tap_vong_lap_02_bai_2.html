<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = parseFloat(prompt("Nhập số nguyên dương"));

        if(isNaN(n) || n < 0){
            alert("Nhập số hợp lệ!");
        } else {
            let giaiThua = 1;
            for(let i = 1; i <= n; i++){
                giaiThua *= i;
            }
            alert("Kết quả là: " + giaiThua);
        }
    </script>
</body>
</html>
