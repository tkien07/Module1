<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Bảng cửu chương</h2>
    <table id="bang" border="2"></table>

    <script>
        let table = document.getElementById("bang");
        let cuuChuong = "";

        for (let i = 1; i <= 10; i++) {
            cuuChuong += "<tr>";
            for (let j = 1; j <= 10; j++) {
                cuuChuong += `<td>${j}*${i}=${j * i}</td>`;
            }
            cuuChuong += "</tr>";
        }
        table.innerHTML = cuuChuong; 
    </script>
</body>

</html>
